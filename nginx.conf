# The front door: the app, and the API behind the same origin.
#
# One origin is not a preference. The session cookie is HttpOnly and
# SameSite=Strict, so a browser will not send it to a different origin — the
# app and the API have to look like one site, which is what this does.

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Uploads are not handled by the API yet; this is the JSON body cap the
  # server itself enforces at 1 MB, matched here so a large body is refused by
  # the front door rather than read and then rejected.
  client_max_body_size 2m;

  # The API. `proxy_pass` without a trailing slash keeps the /api prefix,
  # which is what the server's routes expect.
  location /api/ {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Replaced, not appended to: whatever the client sent in this header is
    # not evidence of anything, and the API rate-limits on what is here.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # A PDF or a long report can take a moment; a sign-in should not hang
    # forever if the database is wedged.
    proxy_read_timeout 60s;
    proxy_connect_timeout 5s;
  }

  # Static assets are content-hashed by Vite, so they can be cached hard.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Everything else is the single-page app. index.html itself is never cached,
  # or a deployment ships new assets with an old entry point.
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-store";
  }
}
