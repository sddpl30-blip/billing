# nginx for a VPS: TLS, the built app, and the API behind the same origin.
#
# NOT INSTALLED ANYWHERE. Written for a Debian or Ubuntu host with certbot.
#
#   sudo cp deploy/nginx-site.conf /etc/nginx/sites-available/societybooks
#   sudo ln -s /etc/nginx/sites-available/societybooks /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d books.example.org      # fills in the TLS lines
#   sudo nginx -t && sudo systemctl reload nginx
#
# One origin is not a preference: the session cookie is HttpOnly and
# SameSite=Strict, so a browser will not send it to a different origin. The app
# and the API have to look like one site.

server {
  listen 80;
  listen [::]:80;
  server_name books.example.org;

  # Everything else is redirected; certbot's challenge is not.
  location /.well-known/acme-challenge/ { root /var/www/html; }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name books.example.org;

  # certbot writes these two lines.
  # ssl_certificate     /etc/letsencrypt/live/books.example.org/fullchain.pem;
  # ssl_certificate_key /etc/letsencrypt/live/books.example.org/privkey.pem;

  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_timeout 1d;
  ssl_session_cache shared:SocietyBooks:10m;

  # HSTS. Set it once you are sure TLS works, and know that it is sticky: a
  # browser that has seen this will refuse plain HTTP for this host for a year.
  # add_header Strict-Transport-Security "max-age=31536000" always;

  root /var/www/societybooks;
  index index.html;
  client_max_body_size 2m;

  # The API. The server itself sets Cache-Control: no-store, the security
  # headers and the CORS headers; nothing is added or overridden here.
  location /api/ {
    proxy_pass http://127.0.0.1:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Replaced, not appended to: whatever the client sent in this header is
    # not evidence of anything, and the API rate-limits on what is here.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_connect_timeout 5s;
  }

  # Vite content-hashes these, so they can be cached hard.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # The single-page app. index.html is never cached, or a deployment serves new
  # assets with an old entry point.
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-store";
  }
}
